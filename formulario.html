<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.min.css">

</head>
<body>
    <header class="encabezado">
        <img src="img/logopagina.png" alt="Logo de desarrollo web" width="50">
        <span><strong>Introducción a los lenguajes del desarrollo web</strong></span>
    </header>
    <nav class="menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="html.html">HTML</a></li>
            <li><a href="css.html">CSS</a></li>
            <li><a href="javascript.html">JavaScript</a></li>
            <li><a href="formulario.html">Formulario de inscripción</a></li>
        </ul>
    </nav>
    <hr>
    <main class="formulario">
        <h1>Formulario de inscripción a nuestros cursos</h1>
        <p>Por favor, complete los siguientes campos requeridos para registrar su inscripción:</p>
        <br><br>
        <form action="registro.html" method="post">
            <label for="nombre">Nombres:</label>
            <input type="text" id="nombre" required>
            <br><br>

            <label for="apellido">Apellidos:</label>
            <input type="text" id="apellido" required>
            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" required>
            <br><br>

            <label for="curso">Curso de interés:</label>
            <select id="curso" required>
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
            </select><br><br><br>

            <button type="submit">Enviar</button>
        </form>
    </main>
    
    <br>
    <br>
    <hr>
    <footer class="piepagina">
        <p>&copy; 2025 Britney's Blog</p>
    </footer>
</body>
</html>
