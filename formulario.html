<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <header>
        <img src="img/logopagina.png" alt="Logo de desarrollo web" width="50">
        <span>Introducción a los lenguajes del desarrollo web: HTML, CSS y JavaScript</span>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="html.html">HTML</a></li>
            <li><a href="css.html">CSS</a></li>
            <li><a href="javascript.html">JavaScript</a></li>
            <li><a href="formulario.html">Formulario de inscripción</a></li>
        </ul>
    </nav>
    <hr>
    <h1>Formulario de inscripción nuestros cursos</h1>
    <form action="registro.html" method="post">
        <label for="nombre">Nombres:</label>
        <input type="text" id="nombre" required>
        <br><br>

        <label for="apellido">Apellidos:</label>
        <input type="text" id="apellido" required>
        <br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="curso">Curso de interés:</label><br>
        <select id="curso" required>
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
        </select><br><br>

        <button type="submit">Enviar</button>
    </form>
    <br>
    <br>
    <hr>
    <footer>
        <p>&copy; 2025 Britney's Blog</p>
    </footer>
</body>
</html>
