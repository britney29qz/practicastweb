<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <!--Links para vincular con la hoja de estilos y la librería de íconos de FontAwesome-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="libreriaFontAwesome/css/all.css">
</head>
<body class="font-sans bg-gray-200 text-neutral-800 leading-relaxed">
    <!--Encabezado con logo y título para todas las páginas-->
    <header class="bg-teal-950 text-white p-7 text-center text-3xl md:text-4xl flex justify-center gap-4">
        <img src="img/logopagina.png" alt="Logo de desarrollo web" class="w-15">
        <span><strong>Introducción a los lenguajes del desarrollo web</strong></span>
    </header>
    <!--Menú de navegación para todas las páginas-->
    <nav class="bg-teal-900 text-white flex justify-center p-4">
        <ul class="flex flex-row gap-16 list-none no-underline">
            <li><a class="hover:underline hover:font-bold" href="index.html">Inicio</a></li>
            <li><a class="hover:underline hover:font-bold" href="html.html">HTML</a></li>
            <li><a class="hover:underline hover:font-bold" href="css.html">CSS</a></li>
            <li><a class="hover:underline hover:font-bold" href="javascript.html">JavaScript</a></li>
            <li><a class="hover:underline hover:font-bold" href="formulario.html">Formulario de inscripción</a></li>
        </ul>
    </nav>
    <hr>
    <!--Contenido principal de la página-->
    <main class="formulario">
        <h1>Formulario de inscripción a nuestros cursos</h1>
        <p>Por favor, complete los siguientes campos requeridos para registrar su inscripción:</p>
        <br><br>
        <form action="registro.html" method="post">
            <label for="nombre">Nombres:</label>
            <input type="text" id="nombre" required>
            <br><br>

            <label for="apellido">Apellidos:</label>
            <input type="text" id="apellido" required>
            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" required>
            <br><br>

            <label for="curso">Curso de interés:</label>
            <select id="curso" required>
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
            </select><br><br><br>

            <button type="submit" class="bg-sky-500 hover:bg-sky-700">Enviar</button>
        </form>
    </main>
    <br>
    <br>
    <hr>
    <!--Footer para todas las páginas-->
    <footer class="bg-teal-950 text-white text-center p-8">
        <p>&copy; 2025 Britney's Blog</p>
    </footer>
</body>
</html>
